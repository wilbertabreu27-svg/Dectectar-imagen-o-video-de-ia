<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de IA - Imágenes y Videos</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 40px; margin: 0; }
        .container { max-width: 600px; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin: auto; }
        input[type="file"] { display: none; }
        .upload-btn { background: #3b82f6; color: white; padding: 12px 24px; border-radius: 6px; cursor: pointer; display: inline-block; font-weight: bold; margin: 10px; transition: background 0.2s; }
        .upload-btn:hover { background: #2563eb; }
        .btn-video { background: #8b5cf6; }
        .btn-video:hover { background: #7c3aed; }
        #previewContainer { margin-top: 20px; max-height: 300px; overflow: hidden; display: flex; justify-content: center; }
        #previewImage, #previewVideo { max-width: 100%; max-height: 250px; border-radius: 8px; display: none; }
        #statusBox { margin-top: 20px; font-size: 1.1em; font-weight: bold; color: #38bdf8; }
        .resultado-card { margin-top: 20px; padding: 15px; border-radius: 8px; background: #334155; display: none; text-align: left; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Detector Forense de IA</h2>
        <p>Selecciona una opción para analizar tu archivo con el modelo de Hugging Face.</p>

        <!-- Botón separado para Imagen -->
        <label for="imageInput" class="upload-btn">Subir Imagen</label>
        <input type="file" id="imageInput" accept="image/*" onchange="subirArchivo(event, 'imagen')">

        <!-- Botón separado para Video -->
        <label for="videoInput" class="upload-btn btn-video">Subir Video</label>
        <input type="file" id="videoInput" accept="video/mp4,video/quicktime,video/webm" onchange="subirArchivo(event, 'video')">

        <div id="previewContainer">
            <img id="previewImage" alt="Previsualización Imagen">
            <video id="previewVideo" controls></video>
        </div>

        <div id="statusBox"></div>

        <div id="resultadoCard" class="resultado-card">
            <p><strong>Tipo:</strong> <span id="resTipo"></span></p>
            <p><strong>Veredicto:</strong> <span id="resVeredicto"></span></p>
            <p><strong>Confianza:</strong> <span id="resConfianza"></span>%</p>
            <p><span id="resDetalles" style="font-size: 0.9em; color: #94a3b8;"></span></p>
        </div>
    </div>

    <script>
        async function subirArchivo(event, tipo) {
            const archivo = event.target.files[0];
            if (!archivo) return;

            const previewImg = document.getElementById('previewImage');
            const previewVid = document.getElementById('previewVideo');
            const resultadoCard = document.getElementById('resultadoCard');
            const statusBox = document.getElementById('statusBox');

            resultadoCard.style.display = 'none';
            previewImg.style.display = 'none';
            previewVid.style.display = 'none';

            const urlArchivo = URL.createObjectURL(archivo);
            if (tipo === 'video') {
                previewVid.src = urlArchivo;
                previewVid.style.display = 'block';
            } else {
                previewImg.src = urlArchivo;
                previewImg.style.display = 'block';
            }

            const formData = new FormData();
            formData.append('file', archivo);

            statusBox.innerText = tipo === 'video' 
                ? "Procesando video fotograma por fotograma (esto puede tardar)..." 
                : "Analizando imagen con el modelo de IA...";

            const endpoint = tipo === 'video' ? '/analizar-video' : '/analizar-imagen';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    statusBox.innerText = "";
                    document.getElementById('resTipo').innerText = data.tipo.toUpperCase();
                    document.getElementById('resVeredicto').innerText = data.veredicto;
                    document.getElementById('resConfianza').innerText = data.confianza;
                    document.getElementById('resDetalles').innerText = data.detalles || "";
                    resultadoCard.style.display = 'block';
                } else {
                    statusBox.innerText = "Error: " + (data.error || "No se pudo procesar");
                }
            } catch (error) {
                statusBox.innerText = "Error de conexión con el servidor.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
