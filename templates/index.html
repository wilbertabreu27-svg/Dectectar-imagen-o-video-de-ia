<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector Agnóstico de IA - Media</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 40px; margin: 0; }
        .container { max-width: 600px; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin: auto; }
        input[type="file"] { display: none; }
        .upload-btn { background: #3b82f6; color: white; padding: 12px 24px; border-radius: 6px; cursor: pointer; display: inline-block; font-weight: bold; transition: background 0.2s; }
        .upload-btn:hover { background: #2563eb; }
        #previewContainer { margin-top: 20px; max-height: 300px; overflow: hidden; display: flex; justify-content: center; }
        #previewImage, #previewVideo { max-width: 100%; max-height: 250px; border-radius: 8px; display: none; }
        #statusBox { margin-top: 20px; font-size: 1.1em; font-weight: bold; color: #38bdf8; }
        .resultado-card { margin-top: 20px; padding: 15px; border-radius: 8px; background: #334155; display: none; text-align: left; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Detector Forense de Medios (IA Agnóstico)</h2>
        <p>Sube una imagen o un video para analizar alteraciones sintéticas en el servidor.</p>

        <label for="fileInput" class="upload-btn">Seleccionar Archivo</label>
        <input type="file" id="fileInput" accept="image/*,video/mp4,video/quicktime,video/webm" onchange="manejarSeleccion(event)">

        <div id="previewContainer">
            <img id="previewImage" alt="Previsualización">
            <video id="previewVideo" controls></video>
        </div>

        <div id="statusBox"></div>

        <div id="resultadoCard" class="resultado-card">
            <p><strong>Veredicto:</strong> <span id="resVeredicto"></span></p>
            <p><strong>Tipo:</strong> <span id="resTipo"></span></p>
            <p><strong>Detalles:</strong> <span id="resDetalles"></span></p>
        </div>
    </div>

    <script>
        async function manejarSeleccion(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;

            // Mostrar previsualización
            const previewImg = document.getElementById('previewImage');
            const previewVid = document.getElementById('previewVideo');
            const resultadoCard = document.getElementById('resultadoCard');
            const statusBox = document.getElementById('statusBox');

            resultadoCard.style.display = 'none';
            previewImg.style.display = 'none';
            previewVid.style.display = 'none';

            const urlArchivo = URL.createObjectURL(archivo);
            if (archivo.type.startsWith('video/')) {
                previewVid.src = urlArchivo;
                previewVid.style.display = 'block';
            } else {
                previewImg.src = urlArchivo;
                previewImg.style.display = 'block';
            }

            // Enviar al servidor Flask
            const formData = new FormData();
            formData.append('file', archivo);

            statusBox.innerText = "Procesando archivo en el servidor...";

            try {
                const response = await fetch('/analizar', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    statusBox.innerText = "";
                    document.getElementById('resVeredicto').innerText = data.veredicto;
                    document.getElementById('resTipo').innerText = data.tipo.toUpperCase();
                    document.getElementById('resDetalles').innerText = data.detalles;
                    resultadoCard.style.display = 'block';
                } else {
                    statusBox.innerText = "Error: " + (data.error || "No se pudo procesar");
                }
            } catch (error) {
                statusBox.innerText = "Error de conexión con el servidor.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
